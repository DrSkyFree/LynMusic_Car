name: LynMusic Car Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-car-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v6

      - name: Configure Gradle memory for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536M
          org.gradle.workers.max=2
          EOF

      - name: Decode signing keystore
        shell: bash
        env:
          ANDROID_SIGNING_STORE_FILE_B64: ${{ secrets.ANDROID_SIGNING_STORE_FILE_B64 }}
        if: ${{ env.ANDROID_SIGNING_STORE_FILE_B64 != '' }}
        run: |
          echo "$ANDROID_SIGNING_STORE_FILE_B64" | base64 -d > "$GITHUB_WORKSPACE/lyn-release.keystore"

      # When no signing secrets are configured, all four variables stay blank and
      # configureLynReleaseSigning() keeps the release build unsigned (partial config errors out).
      - name: Clean & Build Car Release APKs (per-ABI + universal)
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/lyn-release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew clean :automotiveApp:assembleRelease

      # 证书指纹是公开信息,固定在此;每次发布核对其不变,保证覆盖安装兼容
      - name: Verify APK signatures (fingerprint check, fail on unsigned)
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 12ce1bfad3fadd82331c21d384f548fcfaf2d5f5a2c073fc28411303ba024e73
        run: |
          SDK_DIR="$ANDROID_HOME"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          FAIL=0
          for apk in automotiveApp/build/outputs/apk/release/*.apk; do
            echo "--- $apk ---"
            "$APKSIGNER" verify --print-certs "$apk" > /tmp/cert.txt 2>&1 || { echo "apksigner 校验失败: $apk"; FAIL=1; continue; }
            CERT_SHA=$(grep -oE '[0-9a-f]{64}' /tmp/cert.txt | head -1)
            if [ -z "$CERT_SHA" ]; then
              echo "未检测到签名: $apk"; FAIL=1; continue
            fi
            echo "签名证书 SHA-256: $CERT_SHA"
            if [ "$CERT_SHA" != "$EXPECTED_CERT_SHA256" ]; then
              echo "指纹与预期不一致!预期 $EXPECTED_CERT_SHA256"; FAIL=1
            fi
          done
          exit $FAIL

      - name: Upload Car Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: LynMusic-Car-APK-Release
          path: automotiveApp/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-car-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: find release-assets -type f | sort

      - name: Decide release type
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ -(beta|rc)([.-].*)?$ ]]; then
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            echo "title=${TAG} Pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "kind=draft" >> "$GITHUB_OUTPUT"
            echo "title=${TAG} Draft Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > RELEASE_NOTES.md << EOF
          LynMusic_Car ${GITHUB_REF_NAME}
          EOF

          if [ -f CHANGELOG.md ]; then
            # 提取 CHANGELOG.md 中匹配版本的章节(## x.y.z 直到下一个 ## 或文件尾)
            awk -v ver="$VERSION" '
              $0 ~ "^## "ver"($|[[:space:]])" {found=1; next}
              found && /^## / {exit}
              found {print}
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "LynMusic_Car ${GITHUB_REF_NAME}"
              echo ""
              echo "本版本未在 CHANGELOG.md 中找到对应小节,以下是自上个 tag 以来的提交:"
              echo ""
              git log --oneline "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"..HEAD 2>/dev/null || true
            } > RELEASE_NOTES.md
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' FILES < <(find release-assets -type f \
            \( -name "*.apk" \
            -o -name "*.aab" \) \
            -print0)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          EXTRA_ARGS=()
          if [ "${{ steps.meta.outputs.kind }}" = "prerelease" ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--draft)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${FILES[@]}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${EXTRA_ARGS[@]}"
